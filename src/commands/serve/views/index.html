<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f1117;
      --fg: #e2e8f0;
      --border: #2d3748;
      --hover-bg: #1e293b;
      --row-border: #1e293b;
      --brand: #22d3ee;
      --title: #f1f5f9;
      --breadcrumb: #94a3b8;
      --link: #38bdf8;
      --muted: #64748b;
      --file-fg: #e2e8f0;
      --footer: #334155;
      --empty: #475569;
      --btn-bg: #1e293b;
      --btn-fg: #94a3b8;
      --btn-border: #2d3748;
    }
    [data-theme="light"] {
      --bg: #f8fafc;
      --fg: #1e293b;
      --border: #e2e8f0;
      --hover-bg: #f1f5f9;
      --row-border: #e2e8f0;
      --brand: #0891b2;
      --title: #0f172a;
      --breadcrumb: #64748b;
      --link: #0284c7;
      --muted: #94a3b8;
      --file-fg: #334155;
      --footer: #94a3b8;
      --empty: #94a3b8;
      --btn-bg: #e2e8f0;
      --btn-fg: #475569;
      --btn-border: #cbd5e1;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--fg);
      padding: 2rem;
      min-height: 100vh;
      font-size: 14px;
      transition: background 0.2s, color 0.2s;
    }
    body[data-upload-enabled="false"] .upload-only { display: none !important; }
    .header {
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
    }
    .header-left { flex: 1; min-width: 0; }
    .brand {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--brand);
      margin-bottom: 0.5rem;
    }
    .page-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--title);
      word-break: break-all;
    }
    .breadcrumb {
      margin-top: 0.5rem;
      font-size: 0.8rem;
      color: var(--breadcrumb);
    }
    .breadcrumb a { color: var(--link); text-decoration: none; }
    .breadcrumb a:hover { text-decoration: underline; }
    .theme-btn {
      flex-shrink: 0;
      margin-top: 0.1rem;
      padding: 0.35rem 0.65rem;
      background: var(--btn-bg);
      color: var(--btn-fg);
      border: 1px solid var(--btn-border);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      line-height: 1;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
      white-space: nowrap;
    }
    .theme-btn:hover { opacity: 0.8; }
    table { width: 100%; border-collapse: collapse; }
    thead th {
      text-align: left;
      padding: 0.5rem 0.75rem;
      color: var(--muted);
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      border-bottom: 1px solid var(--border);
    }
    thead th.right { text-align: right; }
    tbody tr { transition: background 0.1s; }
    tbody tr:hover { background: var(--hover-bg); }
    tbody td {
      padding: 0.55rem 0.75rem;
      border-bottom: 1px solid var(--row-border);
      vertical-align: middle;
    }
    .name-cell { display: flex; align-items: center; }
    .name-cell > a { display: inline-flex; align-items: center; gap: 0.5rem; min-width: 0; }
    .icon { flex-shrink: 0; }
    .thumbnail {
      position: relative;
      display: flex;
      flex: 0 0 36px;
      width: 36px;
      height: 36px;
      overflow: hidden;
      border-radius: 4px;
      background: var(--hover-bg);
    }
    .thumbnail img { width: 100%; height: 100%; object-fit: cover; }
    .thumbnail-fallback { display: none; width: 100%; align-items: center; justify-content: center; }
    .thumbnail.failed img { display: none; }
    .thumbnail.failed .thumbnail-fallback { display: flex; }
    .dir-link a { color: var(--link); text-decoration: none; font-weight: 500; }
    .dir-link a:hover { text-decoration: underline; }
    .file-link a { color: var(--file-fg); text-decoration: none; }
    .file-link a:hover { color: var(--link); text-decoration: underline; }
    .parent-link a { color: var(--muted); text-decoration: none; }
    .parent-link a:hover { color: var(--breadcrumb); text-decoration: underline; }
    .size-col {
      color: var(--muted);
      text-align: right;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .date-col {
      color: var(--muted);
      text-align: right;
      white-space: nowrap;
      font-size: 0.8rem;
      font-variant-numeric: tabular-nums;
    }
    .footer { margin-top: 1.25rem; font-size: 0.72rem; color: var(--footer); }
    .empty-state { padding: 2rem; text-align: center; color: var(--empty); font-style: italic; }
    .upload-btn {
      flex-shrink: 0;
      margin-top: 0.1rem;
      padding: 0.35rem 0.65rem;
      background: var(--brand);
      color: #0f172a;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      line-height: 1;
      transition: opacity 0.15s;
      white-space: nowrap;
    }
    .upload-btn:hover { opacity: 0.8; }
    .upload-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .progress-wrap { margin-bottom: 1rem; }
    .progress-track { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; margin-bottom: 0.3rem; }
    .progress-fill { height: 100%; background: var(--brand); border-radius: 2px; width: 0%; transition: width 0.1s ease; }
    .progress-text { font-size: 0.72rem; color: var(--muted); }
    .drop-overlay { display: none; position: fixed; inset: 0; background: rgba(34,211,238,0.08); border: 3px dashed var(--brand); z-index: 1000; pointer-events: none; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 600; color: var(--brand); }
  </style>
  <script>
    (function() {
      var saved = localStorage.getItem('theme');
      if (saved === 'light') document.documentElement.setAttribute('data-theme', 'light');
    })();
  </script>
</head>
<body data-upload-enabled="{{UPLOAD_ENABLED}}">
  <div class="header">
    <div class="header-left">
      <div class="brand">HACKYCY CLI &mdash; File Server</div>
      <div class="page-title">{{TITLE}}</div>
      <div class="breadcrumb">{{BREADCRUMB}}</div>
    </div>
    <button class="theme-btn" id="themeBtn" onclick="toggleTheme()" title="Toggle theme">&#9790;</button>
    <input type="file" id="fileInput" class="upload-only" style="display:none">
    <button class="upload-btn upload-only" id="uploadBtn" onclick="document.getElementById('fileInput').click()" title="Upload file">&#x2B06; Upload</button>
  </div>
  <script>
    function toggleTheme() {
      var html = document.documentElement;
      var btn = document.getElementById('themeBtn');
      if (html.getAttribute('data-theme') === 'dark') {
        html.setAttribute('data-theme', 'light');
        localStorage.setItem('theme', 'light');
        btn.textContent = '\u2600';
      } else {
        html.setAttribute('data-theme', 'dark');
        localStorage.setItem('theme', 'dark');
        btn.textContent = '\u263E';
      }
    }
    (function() {
      var btn = document.getElementById('themeBtn');
      var theme = document.documentElement.getAttribute('data-theme');
      btn.textContent = theme === 'light' ? '\u2600' : '\u263E';
    })();
  </script>
  <div id="progressWrap" class="progress-wrap upload-only" style="display:none">
    <div class="progress-track"><div class="progress-fill" id="uploadFill"></div></div>
    <span class="progress-text" id="progressText"></span>
  </div>
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th class="right">Size</th>
        <th class="right">Modified</th>
      </tr>
    </thead>
    <tbody>
      {{PARENT_ROW}}
      {{ENTRY_ROWS}}
    </tbody>
  </table>
  <div class="footer">
    {{ITEM_COUNT}} item{{ITEM_SUFFIX}} &bull; ycy file server
  </div>
  <div id="dropOverlay" class="drop-overlay upload-only">Drop file to upload</div>
  <script>
    if (document.body.dataset.uploadEnabled === 'true') {
      function uploadFile(file) {
        var dir = window.location.pathname;
        var xhr = new XMLHttpRequest();
        xhr.open('POST', '/__upload?dir=' + encodeURIComponent(dir));
        var wrap = document.getElementById('progressWrap');
        var fill = document.getElementById('uploadFill');
        var text = document.getElementById('progressText');
        var btn = document.getElementById('uploadBtn');
        wrap.style.display = 'block';
        btn.disabled = true;
        xhr.upload.onprogress = function(e) {
          if (e.lengthComputable) {
            var pct = Math.round(e.loaded / e.total * 100);
            fill.style.width = pct + '%';
            text.textContent = pct + '%';
          }
        };
        xhr.onload = function() {
          if (xhr.status === 200) {
            window.location.reload();
          } else {
            wrap.style.display = 'none';
            btn.disabled = false;
            alert('Upload failed (' + xhr.status + '): ' + xhr.responseText);
          }
        };
        xhr.onerror = function() {
          wrap.style.display = 'none';
          btn.disabled = false;
          alert('Upload failed: network error');
        };
        var fd = new FormData();
        fd.append('file', file);
        xhr.send(fd);
      }
      document.getElementById('fileInput').addEventListener('change', function() {
        var f = this.files[0];
        if (f) uploadFile(f);
        this.value = '';
      });
      var _dragCnt = 0;
      var _overlay = document.getElementById('dropOverlay');
      document.addEventListener('dragenter', function(e) {
        e.preventDefault();
        _dragCnt++;
        _overlay.style.display = 'flex';
      });
      document.addEventListener('dragleave', function() {
        _dragCnt--;
        if (_dragCnt <= 0) { _dragCnt = 0; _overlay.style.display = 'none'; }
      });
      document.addEventListener('dragover', function(e) { e.preventDefault(); });
      document.addEventListener('drop', function(e) {
        e.preventDefault();
        _dragCnt = 0;
        _overlay.style.display = 'none';
        var f = e.dataTransfer && e.dataTransfer.files[0];
        if (f) uploadFile(f);
      });
    }
  </script>
</body>
</html>
